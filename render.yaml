services:
  - type: web
    name: moonlight-flame
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py bootstrap_data && python manage.py ensure_superuser
    startCommand: gunicorn candle.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moonlight-flame-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"

databases:
  - name: moonlight-flame-db
